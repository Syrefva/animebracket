version: '3.1'

services:
  web:
    build:
      context: .
    environment:
      CORE_LOCATION: /app
    ports:
      - '${APP_PORT}:80'
    volumes:
      - ./:/app
    depends_on:
      - db
    restart: always
  db:
    image: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: true
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/init-nobody-character.sql:/docker-entrypoint-initdb.d/02-nobody-character.sql
    restart: always

volumes:
  dbdata:
